<?xml version="1.0" encoding="UTF-8"?>
<!-- Lusan icon: the tools that do not fit the row, three dots on the middle column.
     The dots stand upright, across the run of tool icons rather than along it, so the mark
     reads as a control and not as one more tool. They are drawn heavier than the stroke of
     the set: the mark has to be seen, or the tools behind it are never looked for. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" color="#000000">
<g fill="currentColor" stroke="none">
<circle cx="12" cy="5.5" r="2.5"/>
<circle cx="12" cy="12" r="2.5"/>
<circle cx="12" cy="18.5" r="2.5"/>
</g>
</svg>
