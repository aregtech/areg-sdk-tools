<?xml version="1.0" encoding="UTF-8"?>
<!--
    Structure: one thing made of parts. Four blocks of unequal size, so it cannot be mistaken
    for the equal rows of the Enumeration mark, and flat-filled like the Container and Imported
    marks rather than outlined. The two larger blocks carry the strong tone, so the mark keeps
    its weight beside them. The ink spans 14 of the 24 unit box, which is the margin the other
    three category marks carry.
 -->
<svg width="64px" height="64px" viewBox="0 0 24 24" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <g fill-rule="evenodd">
    <rect x="5"    y="5"    width="6.3" height="4.8" rx="1.2" fill="#3cc272"/>
    <rect x="12.7" y="5"    width="6.3" height="8.2" rx="1.2" fill="#00a63a"/>
    <rect x="5"    y="11.2" width="6.3" height="7.8" rx="1.2" fill="#00a63a"/>
    <rect x="12.7" y="14.6" width="6.3" height="4.4" rx="1.2" fill="#3cc272"/>
  </g>
</svg>
