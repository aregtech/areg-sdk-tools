<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Shape library: a square signal pulse, right angle corners, one rising and one falling edge.
     Candidate glyph for a signal. Kept as an asset because it is too thin to survive the 8 px
     the state body rows give a stimulus mark, so it cannot serve as the Event mark. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64"
     fill="none" stroke="#7c3aed" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="miter">
  <path d="M10 42 L22 42 L22 20 L40 20 L40 42 L54 42"/>
</svg>
