<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Shape library: a push button in profile, a solid cap seated on an open housing.
     Adopted as the FSM Trigger glyph, so this is the neutral reference copy of the same
     geometry; the live assets are sm-method-trigger.svg and SMToolIcons::eIcon::NewTrigger.
     A press arrow above the cap was tried and dropped: the two shapes merge at icon size. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64"
     fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <rect x="12" y="32" width="40" height="20" rx="6"/>
  <rect x="21" y="20" width="22" height="13" rx="5" fill="#7c3aed"/>
</svg>
