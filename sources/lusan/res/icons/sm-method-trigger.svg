<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- FSM Trigger: a push button in profile, a solid cap seated on an open housing (the stimulus
     the application raises to move the machine). Rectangular on purpose: the action gear and the
     condition diamond beside it are round, and the event bolt is a filled mass, so the silhouette
     alone tells the four apart. Geometry mirrors SMToolIcons::eIcon::NewTrigger at twice the scale. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64"
     fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <rect x="12" y="32" width="40" height="20" rx="6"/>
  <rect x="21" y="20" width="22" height="13" rx="5" fill="#7c3aed"/>
</svg>
