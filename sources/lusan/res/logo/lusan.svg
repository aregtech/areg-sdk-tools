<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Metallic Orange Outer Gradient -->
    <linearGradient id="orangeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA726"/>
      <stop offset="45%" stop-color="#FF6D00"/>
      <stop offset="100%" stop-color="#B23C00"/>
    </linearGradient>

    <!-- Secondary Contrast Gradient -->
    <linearGradient id="orangeGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD180"/>
      <stop offset="55%" stop-color="#E65100"/>
      <stop offset="100%" stop-color="#7A1F00"/>
    </linearGradient>

    <!-- Specular Rim Highlight -->
    <linearGradient id="rimHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF9E00" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Central White Light Core -->
    <radialGradient id="centerWhiteLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FFF3E0"/>
      <stop offset="65%" stop-color="#FF9100"/>
      <stop offset="100%" stop-color="#DD2C00" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Drop Shadow for Contrast on Light/Dark Themes -->
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#iconShadow)">
    <!-- Central White Light Glow -->
    <circle cx="256" cy="256" r="115" fill="url(#centerWhiteLight)"/>

    <!-- Interlocking Kinetic Ring 1 (0 Deg) -->
    <g transform="rotate(0 256 256)">
      <ellipse cx="256" cy="256" rx="64" ry="188" fill="none" stroke="url(#orangeGrad1)" stroke-width="34"/>
      <ellipse cx="256" cy="256" rx="64" ry="188" fill="none" stroke="url(#rimHighlight)" stroke-width="5" opacity="0.7"/>
    </g>

    <!-- Interlocking Kinetic Ring 2 (60 Deg) -->
    <g transform="rotate(60 256 256)">
      <ellipse cx="256" cy="256" rx="64" ry="188" fill="none" stroke="url(#orangeGrad2)" stroke-width="34"/>
      <ellipse cx="256" cy="256" rx="64" ry="188" fill="none" stroke="url(#rimHighlight)" stroke-width="5" opacity="0.7"/>
    </g>

    <!-- Interlocking Kinetic Ring 3 (120 Deg) -->
    <g transform="rotate(120 256 256)">
      <ellipse cx="256" cy="256" rx="64" ry="188" fill="none" stroke="url(#orangeGrad1)" stroke-width="34"/>
      <ellipse cx="256" cy="256" rx="64" ry="188" fill="none" stroke="url(#rimHighlight)" stroke-width="5" opacity="0.7"/>
    </g>

    <!-- Pure White Central Core Emitter -->
    <circle cx="256" cy="256" r="30" fill="#FFFFFF"/>
    <circle cx="256" cy="256" r="44" fill="none" stroke="#FFE0B2" stroke-width="5" opacity="0.85"/>
  </g>
</svg>
